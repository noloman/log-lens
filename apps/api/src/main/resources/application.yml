spring:
  datasource:
    # Overridden in containers via SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD
    url: jdbc:postgresql://localhost:5432/loglens
    username: loglens
    password: loglens
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  output:
    ansi:
      enabled: ALWAYS
  application:
    name: loglens-api
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000
